<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Organizer</title>
<style>
  :root { --fg:#1c1c1c; --mut:#666; --line:#ddd; --bg:#fff; --acc:#0a66c2; --danger:#c0392b; }
  * { box-sizing:border-box; }
  body { font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; color:var(--fg); margin:0; background:var(--bg); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; margin-right:8px; }
  input[type=text] { flex:1; min-width:220px; padding:7px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { padding:7px 14px; border:1px solid var(--line); border-radius:6px; background:#fafafa; font:inherit; cursor:pointer; }
  button:hover { background:#f0f0f0; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.primary:hover { background:#084e94; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.45; cursor:default; }
  #toolbar { padding:10px 18px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #filter { flex:1; min-width:180px; }
  main { padding:0 18px 18px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { position:sticky; top:0; background:#fafafa; user-select:none; }
  td.cat { min-width:150px; }
  td.cat select { width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  tr:hover td { background:#f7f9fc; }
  #status { margin-top:10px; color:var(--mut); font-size:13px; }
  #error { color:var(--danger); }
  .wrap { max-height:calc(100vh - 240px); overflow:auto; border:1px solid var(--line); border-radius:8px; }
  dialog { border:1px solid var(--line); border-radius:10px; padding:18px; width:640px; max-width:94vw; max-height:88vh; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h2 { font-size:15px; margin:0 0 12px; }
  .cfg-cat { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .cfg-cat h3 { margin:0 0 6px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cfg-cat textarea { width:100%; min-height:54px; font:12px/1.4 ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:5px; padding:6px; resize:vertical; }
  .cfg-cat label { font-size:12px; color:var(--mut); display:block; margin:4px 0 2px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .spacer { flex:1; }
  .muted { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>📁 Lazy Organizer</h1>
  <input type="text" id="dir" placeholder="Folder path, e.g. C:\Users\you\Downloads">
  <button id="pickBtn" class="primary">Browse…</button>
  <button id="scanBtn">Scan</button>
</header>
<div id="toolbar">
  <input type="text" id="filter" placeholder="Filter by name, ext, or category...">
  <button id="allBtn">All</button>
  <button id="noneBtn">None</button>
  <button id="invBtn">Invert</button>
  <span class="spacer"></span>
  <button id="cfgBtn">Config</button>
  <button id="undoBtn">Undo</button>
  <button id="orgBtn" class="primary" disabled>Organize (0)</button>
</div>
<main>
  <div class="wrap"><table>
    <thead><tr><th style="width:34px"></th><th>Name</th><th style="width:90px">Ext</th><th style="width:170px">Category</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <div id="status">Select a folder to begin.</div>
  <div id="error"></div>
</main>

<dialog id="cfgDlg">
  <h2>Config Editor</h2>
  <div class="row">
    <button id="addCfg">Add Category</button>
    <label class="muted">Fallback:</label>
    <select id="fallbackSel"></select>
    <button id="resetCfg" class="danger">Reset to Defaults</button>
    <span class="spacer"></span>
    <button id="saveCfg" class="primary">Save</button>
    <button id="closeCfg">Close</button>
  </div>
  <div id="cfgList" style="margin-top:10px"></div>
</dialog>

<script>
let files = [];
let filtered = [];
let selected = new Set();
let dir = "";
let config = { categories: {}, fallback: "Others" };

const $ = id => document.getElementById(id);
const tbody = $("tbody");

function setStatus(t, err) {
  $("status").textContent = t;
  $("error").textContent = err || "";
}

function applyFilter() {
  const q = $("filter").value.trim().toLowerCase();
  filtered = files.filter(f =>
    !q || f.name.toLowerCase().includes(q) || f.ext.toLowerCase().includes(q) || f.category.toLowerCase().includes(q)
  );
  render();
}

function render() {
  tbody.innerHTML = "";
  for (const f of filtered) {
    const tr = document.createElement("tr");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(f.name);
    cb.onchange = () => { cb.checked ? selected.add(f.name) : selected.delete(f.name); updateOrg(); };
    const sel = document.createElement("select");
    const cats = Object.keys(config.categories).concat(config.fallback);
    for (const c of cats) {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      if (c === f.category) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = () => { f.category = sel.value; updateOrg(); };
    const tdCb = document.createElement("td");
    tdCb.appendChild(cb);
    const tdN = document.createElement("td"); tdN.textContent = f.name;
    const tdE = document.createElement("td"); tdE.textContent = f.ext;
    const tdC = document.createElement("td"); tdC.className = "cat"; tdC.appendChild(sel);
    tr.append(tdCb, tdN, tdE, tdC);
    tbody.appendChild(tr);
  }
  updateStatus();
  updateOrg();
}

function updateOrg() {
  const n = filtered.filter(f => selected.has(f.name)).length;
  $("orgBtn").textContent = "Organize (" + n + ")";
  $("orgBtn").disabled = n === 0;
}

function updateStatus() {
  const total = files.length, shown = filtered.length, checked = filtered.filter(f => selected.has(f.name)).length;
  setStatus(total === shown
    ? total + " files, " + checked + " selected"
    : shown + " files shown (" + total + " total), " + checked + " selected");
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function scan() {
  dir = $("dir").value.trim().replace(/\/+$/, "").replace(/\\+$/, "");
  if (!dir) { setStatus("", "Folder path required."); return; }
  setStatus("Scanning " + dir + "...");
  try {
    const data = await api("/api/scan", { dir });
    files = data.files;
    selected = new Set(files.map(f => f.name));
    $("filter").value = "";
    applyFilter();
    setStatus("");
  } catch (e) { setStatus("", e.message); }
}

$("scanBtn").onclick = scan;
$("pickBtn").onclick = async () => {
  try {
    const res = await fetch("/api/pick-folder", { method: "POST" });
    const data = await res.json();
    if (data.path) { $("dir").value = data.path; await scan(); }
  } catch (e) { setStatus("", e.message); }
};
$("dir").addEventListener("keydown", e => { if (e.key === "Enter") scan(); });
$("filter").oninput = applyFilter;
$("allBtn").onclick = () => { filtered.forEach(f => selected.add(f.name)); render(); };
$("noneBtn").onclick = () => { filtered.forEach(f => selected.delete(f.name)); render(); };
$("invBtn").onclick = () => { filtered.forEach(f => selected.has(f.name) ? selected.delete(f.name) : selected.add(f.name)); render(); };
$("orgBtn").onclick = async () => {
  const picks = filtered.filter(f => selected.has(f.name)).map(f => ({ name: f.name, category: f.category }));
  if (!dir || !picks.length) return;
  if (!confirm("Move " + picks.length + " selected files into category folders?")) return;
  try {
    const data = await api("/api/organize", { dir, files: picks });
    setStatus("Moved " + data.moved + "/" + data.total + " files (use Undo to revert).");
    await scan();
  } catch (e) { setStatus("", e.message); }
};
$("undoBtn").onclick = async () => {
  if (!dir) return;
  if (!confirm("Undo last organize in " + dir + "?")) return;
  try { await api("/api/undo", { dir }); setStatus("Undo complete."); await scan(); }
  catch (e) { setStatus("", e.message); }
};

async function loadConfig() {
  const res = await fetch("/api/config");
  config = await res.json();
  const fsSel = $("fallbackSel");
  fsSel.innerHTML = "";
  Object.keys(config.categories).concat(config.fallback).forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    if (c === config.fallback) o.selected = true;
    fsSel.appendChild(o);
  });
}

function renderCfg() {
  const list = $("cfgList");
  list.innerHTML = "";
  const names = Object.keys(config.categories).sort();
  for (const name of names) {
    const rule = config.categories[name];
    const div = document.createElement("div");
    div.className = "cfg-cat";
    const h = document.createElement("h3");
    h.innerHTML = "<span>" + name + "</span><button class='danger del'>Delete</button>";
    const extL = document.createElement("label"); extL.textContent = "Extensions (one per line):";
    const ext = document.createElement("textarea"); ext.value = (rule.extensions || []).join("\n");
    const kwL = document.createElement("label"); kwL.textContent = "Keywords (one per line):";
    const kw = document.createElement("textarea"); kw.value = (rule.keywords || []).join("\n");
    h.querySelector(".del").onclick = () => {
      delete config.categories[name];
      loadFallbackOpts();
      renderCfg();
    };
    div.append(h, extL, ext, kwL, kw);
    list.appendChild(div);
  }
}

function loadFallbackOpts() {
  const fsSel = $("fallbackSel");
  const cur = fsSel.value;
  fsSel.innerHTML = "";
  Object.keys(config.categories).concat(config.fallback).forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    if (c === cur) o.selected = true;
    fsSel.appendChild(o);
  });
}

$("cfgBtn").onclick = async () => { await loadConfig(); renderCfg(); $("cfgDlg").showModal(); };
$("closeCfg").onclick = () => $("cfgDlg").close();
$("addCfg").onclick = () => {
  const name = prompt("New category name:");
  if (!name || config.categories[name]) return;
  config.categories[name] = { extensions: [], keywords: [] };
  loadFallbackOpts();
  renderCfg();
};
$("resetCfg").onclick = async () => {
  if (!confirm("Reset all categories to defaults?")) return;
  await fetch("/api/config/reset", { method: "POST" });
  await loadConfig(); renderCfg();
};
$("saveCfg").onclick = async () => {
  const cats = {};
  document.querySelectorAll(".cfg-cat").forEach(div => {
    const name = div.querySelector("h3 span").textContent;
    const exts = div.querySelectorAll("textarea")[0].value.split("\n").map(s => s.trim()).filter(Boolean);
    const kws = div.querySelectorAll("textarea")[1].value.split("\n").map(s => s.trim()).filter(Boolean);
    cats[name] = { extensions: exts, keywords: kws };
  });
  const body = { categories: cats, fallback: $("fallbackSel").value || "Others" };
  const res = await fetch("/api/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) { setStatus("", "Config save failed"); return; }
  config = body;
  $("cfgDlg").close();
  if (files.length) render();
  setStatus("Config saved.");
};

loadConfig();
</script>
</body>
</html>
